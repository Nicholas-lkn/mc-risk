[project]
name = "mc-risk"
version = "0.1.0"
description = "Monte Carlo option pricing and portfolio risk engine"
readme = "README.md"
authors = [{ name = "Nicholas-lkn" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
fast = ["numba>=0.60"]
data = ["yfinance>=0.2.40"]
notebooks = ["jupyter>=1.0", "nbconvert>=7.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E741"]
